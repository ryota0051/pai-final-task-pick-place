scripted_demo:
  ros__parameters:
    episodes: 1
    record: true                # false なら収録せず動作のみ
    rate: 20.0                  # 目標 publish 周期 [Hz]（テレオペと同じ）
    settle_time: 1.5            # ホーム・リセット後の待ち [s]
    post_time: 1.0              # 計画終了後も収録を続ける時間 [s]（成功判定の hold_time より長く）
    seed: -1
    verbose: false              # true でフェーズごとのタスク状態をログ出力

    plan:
      z_approach: 0.07
      z_grasp: 0.02             # 円柱（高さ 4cm）の中心高さ
      z_carry: 0.08
      z_place: 0.025
      pitch: 1.134              # 65deg。真下向きだと接近高さで IK 不可（サンプル範囲 301 点で 0.02〜0.08m 全て可）
      move_speed: 0.05          # [m/s]
      min_segment_time: 0.5
      grasp_hold: 0.8
      release_hold: 0.6

    # デモの多様性（人のテレオペに近いばらつきを与える）
    randomize:
      speed_scale: [0.8, 1.2]
      height_jitter: 0.01       # 経由高さの揺らぎ [m]
      xy_noise: 0.003           # 把持・配置位置の揺らぎ [m]
      start_offset: [0.0, 0.0, 0.0]   # 開始姿勢（ホーム手先位置）の各軸の最大ずれ [m]。実験8 の対策では [0.03, 0.03, 0.02]
      start_move_time: 1.5      # ずらした開始姿勢への移動時間 [s]（収録前）

    # DART（Laskey et al., 2017）: 実行する手先目標にだけ外乱を足し、ラベルは外乱なしの指令にする（実験13）。
    # 計画から外れた状態と、そこから戻す正解の組をデモに含める。ラベルはテレオペノードが /teleop/expert_arm_command に出す
    dart:
      max_xy: 0.0               # 水平の外乱の最大（半径）[m]。0 で外乱なし（実験13 では 0.01）
      max_z: 0.0                # 鉛直の外乱の最大 [m]
      period: 0.5               # 外乱の目標値を引き直す間隔 [s]（間は min-jerk）
      phases: [approach, descend]   # 外乱を入れる区間（接近〜下降。運搬・配置には入れない）
      fade_time: 0.4            # 区間の終わりに向けて 0 に戻す時間 [s]
      end_margin: 0.2           # 下降の終了のこの時間前までに 0 にする [s]（閉じる前に腕を追従させる）
