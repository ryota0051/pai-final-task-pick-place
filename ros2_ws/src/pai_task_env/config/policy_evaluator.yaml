policy_evaluator:
  ros__parameters:
    trials: 20
    timeout: 30.0              # 1 試行の制限時間 [s]（デモは 8〜13 秒）
    settle_time: 2.0           # ホーム・リセット後の待ち [s]
    # ホームへの移動完了待ち: 直近 window 秒の関節変動が tolerance 未満になるまで待つ（最大 timeout 秒）。
    # 移動途中で方策を開始すると、正面付近の物体で把持位置が -y 側にずれて失敗する（2026-10-11 の分析）
    settle:
      window: 0.5              # [s]
      tolerance: 0.002         # [rad]
      timeout: 10.0            # [s]
    label: policy              # 出力ファイル名の接頭辞（baseline / objpos など）
    output_dir: ~/dataset/eval
    # カメラ推定（/task/object_pose_est）で評価する場合の遮蔽対策:
    # 腕をカメラ視野外へ退避 → リセット → 検出を待つ → ホーム → 開始（推定値は検出ノードが保持）
    observe:
      enabled: false
      ee: [0.02, -0.15, 0.15, 1.134]   # 退避姿勢 x, y, z, pitch（物体のサンプル範囲 y >= -0.06 を覆わない側）
      move_time: 2.0
      lift_time: 1.0                   # 退避の前に今の位置から真上へ上げる時間 [s]（置いた物体に当てない）。0 で従来どおり斜めに移動
      timeout: 5.0
    # 物体位置の固定リスト: 0 以上の seed を指定すると task.yaml と同じサンプリング条件で
    # 試行数ぶんの位置を再現可能に生成し、条件間（真値 / カメラなど）で同じ配置を比較できる。-1 で毎回ランダム
    positions_seed: -1
    # 置き場所もランダム化する評価（実験12。タスク環境は randomize_place:=true で起動）。
    # 位置リストは (物体 x, y, 置き場所 x, y) になり、positions の直接指定も 4 個ずつ
    randomize_place: false
    task_config: ""                    # 空なら pai_task_env/config/task.yaml
    # 開始姿勢の摂動（開始姿勢のずれ・動作中の開始への頑健性評価。2026-10-11 実験8）
    start:
      home_ee: [0.10, 0.0, 0.08, 1.134]   # pai_web_teleop/config/teleop.yaml の home_ee と一致させる
      offset: [0.0, 0.0, 0.0]            # 手先オフセットの各軸の最大値 [m]（±一様分布）。全て 0 で無効
      offset_seed: 0
      move_time: 1.5                     # ずらした姿勢への移動時間 [s]
      moving: false                      # true: ずらした姿勢からホームへ戻る途中で方策を開始
      moving_delay: 0.3                  # ホーム指令から方策開始までの時間 [s]
    # シーンのランダム化（物体色・机の色味・照明・ダミーの箱。学習した検出器の評価用, ADR 0008）
    scene_randomization:
      enabled: false
      config: ""                         # 空なら pai_task_env/config/domain_randomization.yaml の randomize
      seed: 0
      place: false                       # true: 置き場所の色も変え、ダミーの箱を置き場所に重ねない（実験12）
