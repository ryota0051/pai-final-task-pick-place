policy_evaluator:
  ros__parameters:
    trials: 20
    timeout: 30.0              # 1 試行の制限時間 [s]（デモは 8〜13 秒）
    settle_time: 2.0           # ホーム・リセット後の待ち [s]
    # ホームへの移動完了待ち: 直近 window 秒の関節変動が tolerance 未満になるまで待つ（最大 timeout 秒）。
    # 移動途中で方策を開始すると、正面付近の物体で把持位置が -y 側にずれて失敗する（2026-10-11 の分析）
    settle:
      window: 0.5              # [s]
      tolerance: 0.002         # [rad]
      timeout: 10.0            # [s]
    label: policy              # 出力ファイル名の接頭辞（baseline / objpos など）
    output_dir: ~/dataset/eval
    # カメラ推定（/task/object_pose_est）で評価する場合の遮蔽対策:
    # 腕をカメラ視野外へ退避 → リセット → 検出を待つ → ホーム → 開始（推定値は検出ノードが保持）
    observe:
      enabled: false
      ee: [0.02, -0.15, 0.15, 1.134]   # 退避姿勢 x, y, z, pitch（物体のサンプル範囲 y >= -0.06 を覆わない側）
      move_time: 2.0
      timeout: 5.0
    # 物体位置の固定リスト: 0 以上の seed を指定すると task.yaml と同じサンプリング条件で
    # 試行数ぶんの位置を再現可能に生成し、条件間（真値 / カメラなど）で同じ配置を比較できる。-1 で毎回ランダム
    positions_seed: -1
    task_config: ""                    # 空なら pai_task_env/config/task.yaml
