# テスト用の固定パラメータ（実機調整で config/kinematics.yaml が変わってもテストが壊れないよう分離）
# リンク長・関節リミットは config/kinematics.yaml と同一
# 座標系は crane_plus_base リンク基準 [m, rad]
links:
  base_to_joint1: 0.0454    # crane_plus_base -> joint1 (z)
  joint1_to_joint2: 0.026   # joint1 -> joint2 (z)
  joint2_to_joint3: 0.083   # link2 長
  joint3_to_joint4: 0.0935  # link3 長
  tool_length: 0.07
  tool_offset_y: 0.0

# サーボ原点 150deg 基準で URDF から換算した関節リミット [rad]
joint_limits:
  crane_plus_joint1: [-2.61799, 2.61799]   # 0 .. 300 deg
  crane_plus_joint2: [-1.82474, 1.78373]   # 45.45 .. 252.20 deg
  crane_plus_joint3: [-2.55656, 2.45428]   # 3.52 .. 290.62 deg
  crane_plus_joint4: [-1.84012, 1.76838]   # 44.57 .. 251.32 deg
  crane_plus_joint_hand: [-0.70895, 0.66794]  # 109.38 .. 188.27 deg
