# 提出動画の構成（絵コンテ）。素材の録画は scripts/video/record_clips.py、編集は scripts/video/compose.py が読む。
# パスはコンテナ内。字幕は日本語のみ（ナレーションなし）

output: ~/dataset/media/PAI最終課題_ryokoe1010.mp4
media_dir: ~/dataset/media/clips
size: [1280, 720]
fps: 30
font: /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
font_regular: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
report_img_dir: ~/final_task/docs/report/img

# ---- 画面録画の設定 ----
# 撮影用カメラセンサーはソフトウェア描画でシミュレーションを 0.04 倍速まで遅くするため使わない。
# Gazebo GUI（ウィンドウ最大化）の 3D ビューを ffmpeg の x11grab で録画する（ツールバー・パネルを避けた範囲）
# 録画前の注意（2026-10-17）:
#   - ブラウザの noVNC（リモートでリサイズ）を開いていると画面が窓の大きさに縮み、録画範囲が欠ける。
#     noVNC を閉じ、`DISPLAY=:0 xrandr -s 1920x1080` で戻してから環境を起動する（起動後に戻すと Gazebo の描画が古い大きさのまま）
#   - しばらく操作がないとデスクトップのスクリーンセーバー（mate-screensaver の floaters）が全画面に出て、Gazebo の代わりに写る。
#     `pkill -x mate-screensaver; pkill -x floaters` で止める
capture:
  display: ":0"
  region: [100, 165, 1400, 788]     # x, y, 幅, 高さ（1920x1080 の画面で Gazebo を最大化した場合。画面サイズが変わったら調整する）
  framerate: 20
  view: [0.22, 0.14, 1.17, 0.06, -0.05, 1.04]   # GUI の視点（scripts/sim/gui_view.sh の引数）

# ---- 録画する素材 ----
clips:
  baseline_fail:            # サンプルと同じ観測（関節角のみ）のモデル: 物体位置が変わると失敗
    kind: eval
    infer_config: configs/pick/infer_baseline_ep117.yaml
    positions: [0.14, 0.06]
  scripted_demo:            # 学習データの生成（開始姿勢ばらつきあり）
    kind: scripted
    episodes: 2
    seed: 7
    args: ['-p', 'randomize.start_offset:=[0.03,0.03,0.02]']
  final_camera:             # 最終モデル・俯瞰カメラ推定でいろいろな位置
    kind: eval
    infer_config: configs/pick/infer_objpos_startrand_camera.yaml
    positions: [0.13, 0.0, 0.10, 0.08, 0.15, -0.03, 0.09, 0.11]
    args: ['-p', 'observe.enabled:=true']
  start_old:                # 開始姿勢を上に約 1.3cm ずらす: 固定開始のデモだけで学習したモデル
    kind: eval
    infer_config: configs/pick/infer_objpos_ep117.yaml
    positions: [0.13, -0.01]
    args: ['-p', 'start.offset:=[0.003,0.003,0.015]', '-p', 'start.offset_seed:=11']
  start_new:                # 同じ条件で最終モデル
    kind: eval
    infer_config: configs/pick/infer_objpos_startrand.yaml
    positions: [0.13, -0.01]
    args: ['-p', 'start.offset:=[0.003,0.003,0.015]', '-p', 'start.offset_seed:=11']

  dr_red:                   # 見た目をランダム化したシーン（青い物体＋赤い箱, seed 22670）で赤色検出
    kind: eval
    infer_config: configs/pick/infer_objpos_startrand_camera.yaml
    positions: [0.12, 0.03]
    overhead: true            # GUI はランダム化した照明で暗く映るため、俯瞰カメラ（検出器の入力）の映像を使う
    args: ['-p', 'observe.enabled:=true', '-p', 'scene_randomization.enabled:=true', '-p', 'scene_randomization.seed:=22670']
  dr_learned:               # 同じシーンで学習した検出器（detect_rtdetr_parallel.yaml の検出ノードを別途起動しておく）
    kind: eval
    infer_config: configs/pick/infer_objpos_startrand_learned.yaml
    positions: [0.12, 0.03]
    overhead: true            # GUI はランダム化した照明で暗く映るため、俯瞰カメラ（検出器の入力）の映像を使う
    args: ['-p', 'observe.enabled:=true', '-p', 'scene_randomization.enabled:=true', '-p', 'scene_randomization.seed:=22670']
  place_random:             # 追加実験: 置き場所も毎回変える。M3'（保持中の物体位置を据え置き）を 2 クラスの検出器で動かす
    # 環境は TASK_ENV_ARGS="randomize_place:=true red_detector:=false" で起動し、
    # 検出ノード（configs/detection/detect_rtdetr_v2.yaml）を別途起動しておく。配置は実験12 の評価（seed 0）の試行 0, 6, 10
    kind: eval
    infer_config: configs/pick/infer_objpos_placerand_latch_learned.yaml
    positions: [0.1137, -0.0134, 0.1413, 0.0722, 0.106, 0.0967, 0.1441, -0.0717, 0.1569, -0.0267, 0.0444, -0.1339]
    args: ['-p', 'randomize_place:=true', '-p', 'observe.enabled:=true']
  image_direct:             # 追加実験: 画像を方策に直接入力（関節角＋俯瞰カメラ画像, 明るさの拡張あり。物体・置き場所の座標は与えない）
    # 環境は TASK_ENV_ARGS="randomize_place:=true" で起動（検出ノードは不要）。配置は place_random と同じ（実験12 の評価 seed 0 の試行 0, 6, 10）
    kind: eval
    infer_config: configs/pick/infer_image_color.yaml
    positions: [0.1137, -0.0134, 0.1413, 0.0722, 0.106, 0.0967, 0.1441, -0.0717, 0.1569, -0.0267, 0.0444, -0.1339]
    overhead: true            # 方策への入力（俯瞰カメラ画像）も並べて見せる
    args: ['-p', 'randomize_place:=true', '-p', 'observe.enabled:=true']

# ---- モデル表 ----
# 比較の場面では上部にこの表を重ね、timeline の models に書いたモデルの列を強調する（説明資料 3 章のモデル一覧と同じ記号）
models_title: "この動画で比べるモデル（方策はすべて ACT）"
models_note: "M0〜M3' は、学習したモデルのまま物体位置の入力を真値・カメラ推定・学習した検出器に差し替えて評価"
models:
  - {id: "M0", name: "ベースライン", input: "関節角のみ（サンプルと同じ）", data: "固定開始のデモ 117 本"}
  - {id: "M1", name: "物体位置を観測", input: "関節角＋物体位置", data: "固定開始のデモ 117 本"}
  - {id: "M2", name: "基本課題のモデル", input: "関節角＋物体位置", data: "117＋ばらつき 118 本"}
  - {id: "M3", name: "置き場所ランダム", input: "関節角＋物体位置＋置き場所", data: "置き場所ランダム 339 本"}
  - {id: "M3'", name: "保持中は位置を据え置き", input: "M3 と同じ（保持中は物体位置を据え置き）", data: "M3 と同じ 339 本"}
  - {id: "M4", name: "画像入力", input: "関節角＋俯瞰カメラ画像（座標なし）", data: "画像つき 346 本"}
  - {id: "M4'", name: "画像入力・明るさの拡張", input: "M4 と同じ（学習時に明るさ・彩度を変える）", data: "M4 と同じ 346 本"}

# ---- タイムライン ----
# card: 文字だけの画面 / image: 画像＋字幕 / clip: 素材の切り出し（trials: 何試行目か。方策 ON の 0.5 秒前から成功の 1 秒後まで）
# speed: 再生速度（2 なら 2 倍速。字幕に倍速表示を付ける）。tail: 成功の何秒後まで使うか（既定 1。評価後にシーンが元に戻る場面は短く）
timeline:
  - {type: card, duration: 3, title: "CRANE+ V2 による把持・配置タスクの模倣学習", subtitle: "Physical AI 最終課題 ／ ryokoe1010"}
  - {type: models, duration: 5}
  - {models: ["M2"], type: clip, clip: final_camera, trials: [0], speed: 1, caption: "タスク: 机の上のランダムな位置にある物体を掴み、青い置き場所へ運ぶ（Gazebo）"}
  - {models: ["M0"], type: clip, clip: baseline_fail, trials: [0], speed: 2, max_seconds: 12, caption: "サンプル（関節角のみを観測）は決まった動きを再生するだけで、物体の位置が変わると掴めない（成功率 10%）"}
  - {type: image, image: browser_ui.png, duration: 5, caption: "ブラウザから手先の位置・傾きで操作できる UI を作成（解析的逆運動学で関節角に変換）"}
  - {type: clip, clip: scripted_demo, speed: 2, caption: "学習データは IK で軌道を計画するスクリプトデモで自動生成（235 回。速度・高さ・把持位置・開始姿勢にばらつき）"}
  - {type: card, duration: 5, title: "学習", lines: ["観測: 関節角 ＋ 物体位置", "模倣学習 ACT を GPU で学習（60k step・約 1 時間）", "推論時に temporal ensembling で誤差の蓄積を抑制（55% → 100%）"]}
  - {models: ["M2"], type: image, image: overhead_camera.png, duration: 4, caption: "物体位置は真値を使わず、俯瞰カメラの画像から推定（誤差 1〜2mm）"}
  - {models: ["M2"], type: clip, clip: final_camera, trials: [1, 2, 3], speed: 2, caption: "自律実行（物体位置は俯瞰カメラで推定）"}
  - {models: ["M1", "M2"], type: compare, left: start_old, right: start_new, trials: [0], speed: 2, max_seconds: 14, left_label: "M1: 固定開始のデモだけで学習", right_label: "M2: 開始姿勢をばらつかせたデモを追加", crop: [0.12, 0.22, 0.62, 0.62], caption: "開始姿勢が上に約 1cm ずれると、M1 は空中でグリッパを閉じて物体を掴まずに置き場所へ向かう → 開始姿勢をばらつかせたデモの追加で解消"}
  - {type: image, image: detector_examples.png, duration: 5, caption: "物体の色・照明・机・ダミーの箱を変えた画像で物体検出器（RT-DETRv2）を学習（黄枠: 検出結果。赤×: 赤色検出は赤い物体しか見つけられない）"}
  - {models: ["M2"], type: compare, left: dr_red_overhead, right: dr_learned_overhead, trials: [0], speed: 2, max_seconds: 14, panel_height: 480, tail: 0.2, left_label: "赤色検出", right_label: "学習した物体検出器", caption: "俯瞰カメラの映像（検出器への入力）: 赤色検出は青い物体を見つけられず掴めない。学習した検出器は掴める（見た目を変えた 30 試行で 3% → 100%）"}
  - {models: ["M1", "M2"], type: image, image: fig_start_robustness.png, duration: 6, caption: "物体配置を固定した 30 試行で評価: 開始姿勢を ±3cm ずらしても 100%（カメラ推定でも 97%）"}
  - {models: ["M3'"], type: clip, clip: place_random, trials: [0, 1, 2], speed: 2, caption: "追加実験: 置き場所（青い円）も毎回変える。物体と置き場所の両方を学習した検出器で見つけ、置き場所の位置も観測して運ぶ"}
  - {models: ["M2", "M3"], type: image, image: fig_place_random.png, duration: 5, caption: "置き場所を観測しない M2 は、置き場所が変わると 3%。置き場所も観測する M3 は 97%（M3' を検出器で動かして 93%、見た目を変えても 93%）"}
  - {models: ["M4'"], type: compare, left: image_direct, right: image_direct_overhead, trials: [0], speed: 2, max_seconds: 8, panel_height: 480, tail: 0.5, left_label: "Gazebo", right_label: "方策への入力（俯瞰カメラ画像）", caption: "追加実験: 座標を与えず、カメラ画像を方策（ACT）に直接入れて運ぶ"}
  - {models: ["M4'"], type: compare, left: image_direct, right: image_direct_overhead, trials: [1], speed: 2, max_seconds: 8, panel_height: 480, tail: 0.5, left_label: "Gazebo", right_label: "方策への入力（俯瞰カメラ画像）", caption: "追加実験: 座標を与えず、カメラ画像を方策（ACT）に直接入れて運ぶ"}
  - {models: ["M3'", "M4", "M4'"], type: image, image: fig_image_direct.png, duration: 6, caption: "同じ配置で比較: 置き場所を毎回変える課題では、画像を直接入れても 98%（検出器経由 95%）。見た目を変えたシーンでは検出器経由（93%）に及ばない（50%）"}
  - {type: card, duration: 6, title: "まとめ", lines: ["成功率 10%（サンプル）→ 100%（物体位置は真値・カメラ推定とも）", "評価で弱点を見つけ、記録から原因を突き止めて改善", "物体の色・照明が変わっても学習した物体検出器で成功（3% → 100%）", "追加実験（置き場所も毎回変える）: 検出器で物体と置き場所を見て 93%","追加実験（画像を直接入力）: 座標なしで 98%、見た目の変化には弱い","コード: github.com/ryota0051/pai-final-task-pick-place"]}
