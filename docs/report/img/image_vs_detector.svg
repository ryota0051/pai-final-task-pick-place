<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" font-family="Yu Gothic, YuGothic, Meiryo, Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#2a6fdb"/>
    </marker>
    <style>
      .box { fill: #f4f8fe; stroke: #2a6fdb; stroke-width: 1.5; }
      .det { fill: #fff6e5; stroke: #d08a00; stroke-width: 1.5; }
      .pol { fill: #2a6fdb; stroke: #2a6fdb; stroke-width: 1.5; }
      .t { font-size: 13px; font-weight: bold; fill: #1f2328; text-anchor: middle; dominant-baseline: central; }
      .s { font-size: 11px; fill: #444; text-anchor: middle; dominant-baseline: central; }
      .tw { font-size: 13px; font-weight: bold; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .sw { font-size: 11px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .hd { font-size: 12px; fill: #1b4fa3; font-weight: bold; }
      .nt { font-size: 11px; fill: #8a5a00; }
      .nb { font-size: 11px; fill: #1b4fa3; }
      .ln { stroke: #2a6fdb; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- (a) 検出器を経由（A'） -->
  <text class="hd" x="2" y="14">(a) 検出器で座標にしてから方策へ（M3'）</text>
  <rect class="box" x="1" y="24" width="120" height="44" rx="6"/>
  <text class="t" x="61" y="39">俯瞰カメラ画像</text>
  <text class="s" x="61" y="57">320×240</text>
  <path class="ln" d="M121 46H141" marker-end="url(#ah2)"/>
  <rect class="det" x="143" y="24" width="150" height="44" rx="6"/>
  <text class="t" x="218" y="39">物体検出器</text>
  <text class="s" x="218" y="57">RT-DETRv2（2 クラス）</text>
  <path class="ln" d="M293 46H313" marker-end="url(#ah2)"/>
  <rect class="box" x="315" y="24" width="140" height="44" rx="6"/>
  <text class="t" x="385" y="39">座標（5 次元）</text>
  <text class="s" x="385" y="57">物体 x, y, z・置き場所 x, y</text>
  <path class="ln" d="M455 46H475" marker-end="url(#ah2)"/>
  <rect class="pol" x="477" y="24" width="120" height="44" rx="6"/>
  <text class="tw" x="537" y="39">ACT</text>
  <text class="sw" x="537" y="57">数値だけを入力</text>
  <path class="ln" d="M597 46H617" marker-end="url(#ah2)"/>
  <rect class="box" x="619" y="24" width="100" height="44" rx="6"/>
  <text class="t" x="669" y="46">関節指令</text>
  <rect class="box" x="477" y="78" width="120" height="26" rx="6"/>
  <text class="s" x="537" y="91">関節角（5 次元）</text>
  <path class="ln" d="M537 78V70" marker-end="url(#ah2)"/>
  <text class="nt" x="143" y="122">画像から物体・置き場所の位置を読み取るのは検出器</text>
  <text class="nt" x="143" y="137">→ 物体の色・照明・ダミーの箱の変化に対する頑健性は、静止画 1200 枚で検出器が学ぶ</text>

  <!-- (b) 画像を直接入力 -->
  <text class="hd" x="2" y="170">(b) 画像を方策に直接入力（M4・M4'。物体・置き場所の座標は与えない）</text>
  <rect class="box" x="1" y="180" width="120" height="44" rx="6"/>
  <text class="t" x="61" y="195">俯瞰カメラ画像</text>
  <text class="s" x="61" y="213">320×240</text>
  <path class="ln" d="M121 202H475" marker-end="url(#ah2)"/>
  <rect class="pol" x="477" y="180" width="120" height="44" rx="6"/>
  <text class="tw" x="537" y="195">ACT</text>
  <text class="sw" x="537" y="213">ResNet18 で画像を読む</text>
  <path class="ln" d="M597 202H617" marker-end="url(#ah2)"/>
  <rect class="box" x="619" y="180" width="100" height="44" rx="6"/>
  <text class="t" x="669" y="202">関節指令</text>
  <rect class="box" x="477" y="234" width="120" height="26" rx="6"/>
  <text class="s" x="537" y="247">関節角（5 次元）</text>
  <path class="ln" d="M537 234V226" marker-end="url(#ah2)"/>
  <text class="nb" x="143" y="272">位置の読み取りも方策が画像から学ぶ（ResNet18 は ImageNet 事前学習）</text>
  <text class="nb" x="143" y="287">→ 物体の色・照明・ダミーの箱の変化に対する頑健性も、デモから方策が学ぶ必要がある</text>
</svg>
