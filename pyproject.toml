[project]
name = "final-task-host-tools"
version = "0.1.0"
description = "ホスト側でROS非依存の純Pythonロジックをテストするためのuvプロジェクト"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["ros2_ws/src"]
pythonpath = [
    "ros2_ws/src/crane_plus_kinematics",
    "ros2_ws/src/pai_task_env",
]
addopts = "-q --import-mode=importlib"
